# Baseline point of the search space: a small pre-norm decoder-only Transformer.
# This is the Origin of the demo project — every later experiment derives from it.
name: baseline
seed: 0
backend: auto
device: auto

arch:
  kind: transformer_decoder
  n_layer: 4
  d_model: 256
  n_head: 4
  d_ff: 1024
  norm_position: pre
  norm_type: layernorm
  activation: gelu
  pos_embedding: learned
  tie_embeddings: true
  dropout: 0.0
  attn_dropout: 0.0
  init:
    scheme: gpt2
    std: 0.02
    residual_scale: null
    scale_projection: true

optim:
  name: adamw
  lr: 3.0e-3
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.1
  grad_clip: 1.0
  schedule:
    kind: cosine
    warmup_steps: 50
    min_lr_ratio: 0.1
    decay_fraction: 0.2

data:
  dataset: synthetic_lm
  seq_len: 128
  batch_size: 32
  vocab_size: 256

budget:
  max_steps: 300
  max_epochs: 1
  time_budget_sec: 900
  eval_every: 25
  probe_every: 25
  eval_batches: 10

notes: "Demo baseline. Agents derive children via spec.derive(...) and change 1-2 axes."
